name: Check Offsets

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset off the hour because GitHub drops scheduled runs
    # under load at :00. Pushing a change to this cron line also re-registers the
    # schedule in forks, where scheduled workflows start out disabled.
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: offset-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run offset check
        run: python check_offsets.py
        env:
          WEBHOOK_OFFSETS: ${{ secrets.WEBHOOK_OFFSETS }}
          WEBHOOK_LOG: ${{ secrets.WEBHOOK_LOG }}
          WEBHOOK_ANUNCIOS: ${{ secrets.WEBHOOK_ANUNCIOS }}
          WEBHOOK_FORTNITE: ${{ secrets.WEBHOOK_FORTNITE }}
          WEBHOOK_RUST: ${{ secrets.WEBHOOK_RUST }}
          WEBHOOK_FIVEM: ${{ secrets.WEBHOOK_FIVEM }}
          WEBHOOK_CS2: ${{ secrets.WEBHOOK_CS2 }}
          WEBHOOK_ROBLOX: ${{ secrets.WEBHOOK_ROBLOX }}
          WEBHOOK_ROBRUN: ${{ secrets.WEBHOOK_ROBRUN }}
          WEBHOOK_RETRAC: ${{ secrets.WEBHOOK_RETRAC }}
          WEBHOOK_VALORANT: ${{ secrets.WEBHOOK_VALORANT }}
          WEBHOOK_R6: ${{ secrets.WEBHOOK_R6 }}
          WEBHOOK_WARDOGS: ${{ secrets.WEBHOOK_WARDOGS }}
          WEBHOOK_APEX: ${{ secrets.WEBHOOK_APEX }}

      - name: Save new state to state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          # A queued or manual run may have pushed state.json in the meantime.
          # Move our commit onto the newest remote commit instead of failing the push.
          git fetch origin "$GITHUB_REF_NAME"
          git reset --soft FETCH_HEAD
          git commit -m "Update state.json"
          git push
